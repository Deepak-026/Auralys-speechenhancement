<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="48" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="48" height="48" rx="12" fill="url(#bg)"/>

  <!-- Waveform bars — 7 bars centered, heights vary to suggest audio waveform -->
  <rect x="7"  y="19" width="4" height="10" rx="2" fill="url(#wave)" opacity="0.7"/>
  <rect x="13" y="14" width="4" height="20" rx="2" fill="url(#wave)" opacity="0.85"/>
  <rect x="19" y="10" width="4" height="28" rx="2" fill="url(#wave)"/>
  <rect x="25" y="14" width="4" height="20" rx="2" fill="url(#wave)" opacity="0.85"/>
  <rect x="31" y="19" width="4" height="10" rx="2" fill="url(#wave)" opacity="0.7"/>
  <rect x="37" y="22" width="4" height="5"  rx="2" fill="url(#wave)" opacity="0.5"/>
</svg>
